[project]
name = "phishurl"
version = "1.0.0"
description = "Explainable phishing detection from host names, with a zero-backend browser demo"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: reads the full raw datasets (seconds, not milliseconds)"]
